# EKF config for Agribot
# Fuses: encoder odometry + IMU + GPS

ekf_filter_node:
    ros__parameters:
        frequency: 5.0
        sensor_timeout: 0.1
        two_d_mode: true
        publish_tf: true
        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        world_frame: odom

        # Encoder odometry (x, y, vx, vyaw)
        odom0: /odom
        odom0_config: [true,  true,  false,   # x, y, z position
                       false, false, false,   # roll, pitch, yaw
                       true,  true,  false,   # x_vel, y_vel, z_vel
                       false, false, true,    # roll_vel, pitch_vel, yaw_vel
                       false, false, false]   # x_accel, y_accel, z_accel
        odom0_differential: false
        odom0_queue_size: 10

        # IMU (yaw, yaw_vel from BNO055 NDOF)
        imu0: /imu/data
        imu0_config: [false, false, false,    # x, y, z position
                      false, false, true,     # roll, pitch, yaw
                      false, false, false,    # x_vel, y_vel, z_vel
                      false, false, true,     # roll_vel, pitch_vel, yaw_vel
                      false, false, false]    # x_accel, y_accel, z_accel
        imu0_differential: true
        imu0_remove_gravitational_acceleration: true
        imu0_queue_size: 10
        odom1: /odometry/gps
        odom1_config: [true,  true,  false,
                       false, false, false,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom1_differential: false
        odom1_queue_size: 10
        # GPS -> converted to odometry by navsat_transform
        # We do NOT fuse /fix directly in EKF — navsat_transform publishes /odometry/gps
